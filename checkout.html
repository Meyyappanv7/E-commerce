<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone | Checkout</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">ShopZone</div>
        <div class="nav-right">
            <a href="cart.html" class="cart-link">&#128722;<span class="cart-badge">0</span></a>
        </div>
    </header>

    <div class="steps">
        <div class="step done"><div class="circle">&#10003;</div><span>Cart</span></div>
        <div class="step-line"></div>
        <div class="step active"><div class="circle">2</div><span>Address</span></div>
        <div class="step-line"></div>
        <div class="step"><div class="circle">3</div><span>Payment</span></div>
    </div>

    <section class="heading">
        <h1>Delivery Address</h1>
    </section>

    <div class="checkout-layout">

        <form class="address-form" id="addressForm">
            <h2>Where should we deliver your order?</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="10 digit mobile number" pattern="[0-9]{10}" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom:18px;">
                <label>Address (House No, Street, Area)</label>
                <textarea id="addressLine" rows="3" placeholder="Enter your full address" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="state" placeholder="State" required>
                </div>
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" id="pincode" placeholder="6 digit pincode" pattern="[0-9]{6}" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom:18px;">
                <label>Address Type</label>
                <select id="addressType">
                    <option value="Home">Home</option>
                    <option value="Work">Work</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" class="continue-btn">Continue to Payment</button>
        </form>

        <div class="summary">
            <h2>Order Summary</h2>
            <div id="summaryItems"></div>
            <hr>
            <div class="summary-row"><span>Subtotal</span><span id="subtotalVal">&#8377;0</span></div>
            <div class="summary-row"><span>Delivery</span><span id="deliveryVal">&#8377;0</span></div>
            <hr>
            <div class="summary-total"><span>Total</span><span id="totalVal">&#8377;0</span></div>
        </div>

    </div>

    <footer class="footer">
        <p>&copy; 2026 ShopZone. All Rights Reserved.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Redirect to cart if empty
        const items = getCartDetails();
        if(items.length === 0){
            window.location.href = "cart.html";
        }

        document.getElementById("summaryItems").innerHTML = items.map(item => `
            <div class="summary-item"><span>${item.name} &times; ${item.qty}</span><span>&#8377;${item.price * item.qty}</span></div>
        `).join("");

        const totals = getCartTotals();
        document.getElementById("subtotalVal").textContent = "\u20B9" + totals.subtotal;
        document.getElementById("deliveryVal").textContent = totals.delivery === 0 ? "Free" : "\u20B9" + totals.delivery;
        document.getElementById("totalVal").textContent = "\u20B9" + totals.total;

        // Pre-fill if address already saved
        const saved = getAddress();
        if(saved){
            document.getElementById("fullName").value = saved.fullName || "";
            document.getElementById("phone").value = saved.phone || "";
            document.getElementById("addressLine").value = saved.addressLine || "";
            document.getElementById("city").value = saved.city || "";
            document.getElementById("state").value = saved.state || "";
            document.getElementById("pincode").value = saved.pincode || "";
            document.getElementById("addressType").value = saved.addressType || "Home";
        }

        document.getElementById("addressForm").addEventListener("submit", function(e){
            e.preventDefault();
            const address = {
                fullName: document.getElementById("fullName").value,
                phone: document.getElementById("phone").value,
                addressLine: document.getElementById("addressLine").value,
                city: document.getElementById("city").value,
                state: document.getElementById("state").value,
                pincode: document.getElementById("pincode").value,
                addressType: document.getElementById("addressType").value
            };
            saveAddress(address);
            window.location.href = "payment.html";
        });
    </script>

</body>
</html>
