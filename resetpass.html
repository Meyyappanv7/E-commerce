<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resetpass</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <center>
    <div>
        <form action="signin.html">
            <h1>
                reset password
            </h1>
            <hr>
            <div>
                <input type="password"  placeholder="New password" minlength="8" required maxlength="8"> 
            </div>
            <div>
                <li>minimun 8 char</li>
                <li>1 upper case</li>
                <li>1 lower case</li>
                <li>1 number</li>
                <li>1 special char</li>
            </div>
            <br>
            <div>
                <input type="password" placeholder="confirm password" minlength="8" required maxlength="8">
            </div>
            <br>
            <div>
                <button class="btn btn-primary">
                    reset password
                </button>
            </div>
        </form>
    </div>
    
</body>
</html>
